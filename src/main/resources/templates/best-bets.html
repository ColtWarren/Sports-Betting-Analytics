<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Best Bets - Multi-Sport Analysis</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            color: #e0e7ff;
            font-family: 'Rajdhani', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(20px);
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.2);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        h1 {
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .ai-badge {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .nav-buttons {
            display: flex;
            gap: 10px;
        }
        
        .nav-btn {
        
        .nav-btn span {
            display: inline;
            visibility: visible;
        }
            padding: 10px 20px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .nav-btn:hover {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            transform: translateY(-2px);
        }
        
        .sport-selector {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(20px);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.2);
        }
        
        .sport-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .sport-btn {
            padding: 12px 25px;
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border: 1px solid rgba(99, 102, 241, 0.4);
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .sport-btn:hover {
            background: rgba(51, 65, 85, 0.8);
        }
        
        .sport-btn.active {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #e0e7ff;
        }
        
        .loading {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(20px);
            padding: 60px;
            border-radius: 15px;
            text-align: center;
        }
        
        .loading h2 {
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .stats-bar {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(20px);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.2);
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .stat-label {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 5px;
        }
        
        .bets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
            gap: 20px;
        }
        
        .bet-card {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.2);
            transition: transform 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .bet-card:hover {
            transform: translateY(-5px);
        }
        
        .bet-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        
        .bet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .sport-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }
        
        .sport-nfl { background: #013369; }
        .sport-cfb { background: #CC0000; }
        .sport-nba { background: #17408B; }
        .sport-cbb { background: #FF6B35; }
        .sport-mlb { background: #041E42; }
        .sport-nhl { background: #000000; }
        .sport-soccer { background: linear-gradient(135deg, #2E7D32, #4CAF50); }

        /* Soccer-specific odds display */
        .soccer-odds {
            background: linear-gradient(135deg, rgba(46, 125, 50, 0.15), rgba(76, 175, 80, 0.15));
            border-left: 3px solid #4CAF50;
        }

        .soccer-odds .odds-label {
            color: #81C784;
        }
        
        .confidence-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
        }
        
        .confidence-high { color: #4CAF50; }
        .confidence-medium { color: #FF9800; }
        .confidence-low { color: #f44336; }
        
        .matchup {
            margin: 15px 0;
        }
        
        .teams {
            font-size: 20px;
            font-weight: bold;
            color: #e0e7ff;
            margin-bottom: 5px;
        }
        
        .game-time {
            font-size: 14px;
            color: #94a3b8;
        }
        
        .recommendation {
            background: linear-gradient(135deg, #667eea15, #764ba215);
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            border-left: 4px solid #667eea;
        }
        
        .rec-label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 5px;
            font-weight: 600;
        }
        
        .rec-value {
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .kelly-display {
            font-size: 14px;
            font-weight: 600;
            color: #10b981;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .kelly-percent {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 900;
            color: #34d399;
        }
        
        .best-odds {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }
        
        .odds-item {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 12px;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
        }

        .odds-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
            border-color: rgba(139, 92, 246, 0.6);
        }

        .odds-label {
            font-size: 11px;
            color: #a5b4fc;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .odds-value {
            font-size: 18px;
            font-weight: 900;
            color: #e0e7ff;
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 5px;
        }

        .odds-book {
            font-size: 12px;
            color: #10b981;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .analysis {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(99, 102, 241, 0.2);
        }

        .analysis-label {
            font-size: 12px;
            color: #a5b4fc;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .analysis-text {
            font-size: 14px;
            line-height: 1.6;
            color: #e0e7ff;
        }
        
        .expand-btn {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
            transition: all 0.3s;
        }
        
        .expand-btn:hover {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
        }
        
        .analysis-full {
            display: none;
            margin-top: 10px;
        }
        
        .analysis-full.expanded {
            display: block;
        }

        /* Action Buttons Container */
        .bet-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(99, 102, 241, 0.2);
        }

        /* Base Button Style */
        .action-btn {
            flex: 1;
            padding: 12px 20px;
            border-radius: 8px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Primary Button (Place Bet) */
        .primary-btn {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .primary-btn:hover {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
            transform: translateY(-2px);
        }

        /* Quick Bet Button */
        .quick-bet-btn {
            background: linear-gradient(135deg, #10b981, #34d399);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .quick-bet-btn:hover {
            background: linear-gradient(135deg, #059669, #10b981);
            box-shadow: 0 6px 20px rgba(52, 211, 153, 0.5);
            transform: translateY(-2px);
        }

        /* Button Ripple Effect */
        .action-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .action-btn:active::before {
            width: 300px;
            height: 300px;
        }

        /* Weather Alert Styles */
        .weather-alert {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px;
            border-radius: 10px;
            margin: 15px 0;
            border-left: 4px solid;
        }

        .weather-alert.alert-low {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(96, 165, 250, 0.1));
            border-color: #3b82f6;
        }

        .weather-alert.alert-medium {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(251, 191, 36, 0.1));
            border-color: #f59e0b;
        }

        .weather-alert.alert-high {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(248, 113, 113, 0.1));
            border-color: #ef4444;
        }

        .weather-alert.alert-critical {
            background: linear-gradient(135deg, rgba(220, 38, 38, 0.2), rgba(239, 68, 68, 0.15));
            border-color: #dc2626;
            animation: pulse-critical 2s infinite;
        }

        @keyframes pulse-critical {
            0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4); }
            50% { box-shadow: 0 0 20px 5px rgba(220, 38, 38, 0.2); }
        }

        .weather-icon {
            font-size: 24px;
            flex-shrink: 0;
        }

        .weather-content {
            flex: 1;
        }

        .weather-content strong {
            display: block;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .weather-alert.alert-low .weather-content strong { color: #60a5fa; }
        .weather-alert.alert-medium .weather-content strong { color: #fbbf24; }
        .weather-alert.alert-high .weather-content strong { color: #f87171; }
        .weather-alert.alert-critical .weather-content strong { color: #fca5a5; }

        .weather-content p {
            font-size: 13px;
            color: #cbd5e1;
            margin: 0;
            line-height: 1.5;
        }

        .weather-impact {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            font-size: 12px;
        }

        .weather-impact span {
            padding: 3px 8px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.2);
        }

        .weather-impact .impact-scoring {
            color: #f87171;
        }

        .weather-impact .impact-recommendation {
            color: #34d399;
            font-weight: 600;
        }

        /* Public Betting / Contrarian Alert Styles */
        .public-betting-section {
            margin: 15px 0;
            padding: 14px;
            border-radius: 10px;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.1), rgba(139, 92, 246, 0.05));
            border-left: 4px solid #8b5cf6;
        }

        .public-betting-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .public-betting-title {
            font-size: 12px;
            font-weight: 700;
            color: #a78bfa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .contrarian-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .contrarian-badge.extreme {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            animation: pulse-extreme 1.5s infinite;
        }

        .contrarian-badge.strong {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
        }

        .contrarian-badge.mild {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
        }

        @keyframes pulse-extreme {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            50% { box-shadow: 0 0 15px 3px rgba(239, 68, 68, 0.3); }
        }

        .betting-percentage-bars {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .percentage-bar-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .percentage-bar-label {
            font-size: 11px;
            color: #94a3b8;
            width: 60px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .percentage-bar-container {
            flex: 1;
            height: 20px;
            background: rgba(17, 24, 39, 0.6);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            position: relative;
        }

        .percentage-bar-home {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 8px;
            font-size: 11px;
            font-weight: 700;
            color: white;
            transition: width 0.5s ease;
        }

        .percentage-bar-away {
            height: 100%;
            background: linear-gradient(90deg, #ec4899, #f472b6);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
            font-size: 11px;
            font-weight: 700;
            color: white;
            transition: width 0.5s ease;
        }

        .contrarian-recommendation {
            margin-top: 12px;
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .contrarian-icon {
            font-size: 24px;
        }

        .contrarian-text {
            flex: 1;
        }

        .contrarian-text strong {
            display: block;
            font-size: 13px;
            color: #f472b6;
            margin-bottom: 2px;
        }

        .contrarian-text span {
            font-size: 12px;
            color: #cbd5e1;
        }

        .contrarian-edge {
            text-align: right;
        }

        .contrarian-edge .edge-value {
            font-size: 18px;
            font-weight: 900;
            color: #34d399;
            font-family: 'Orbitron', sans-serif;
        }

        .contrarian-edge .edge-label {
            font-size: 10px;
            color: #94a3b8;
            text-transform: uppercase;
        }

        /* Injury Alert Styles */
        .injury-section {
            margin: 15px 0;
        }

        .injury-alert {
            border-radius: 10px;
            padding: 14px;
            color: white;
            border-left: 4px solid;
        }

        .injury-alert.NONE {
            display: none;
        }

        .injury-alert.MINOR {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.15), rgba(245, 158, 11, 0.1));
            border-color: #fbbf24;
            color: #fef3c7;
        }

        .injury-alert.MODERATE {
            background: linear-gradient(135deg, rgba(251, 146, 60, 0.2), rgba(234, 88, 12, 0.15));
            border-color: #f97316;
            color: #fed7aa;
        }

        .injury-alert.SEVERE {
            background: linear-gradient(135deg, rgba(248, 113, 113, 0.2), rgba(239, 68, 68, 0.15));
            border-color: #ef4444;
            color: #fecaca;
        }

        .injury-alert.CRITICAL {
            background: linear-gradient(135deg, rgba(220, 38, 38, 0.25), rgba(185, 28, 28, 0.2));
            border-color: #dc2626;
            color: #fecaca;
            animation: pulse-injury 2s infinite;
        }

        @keyframes pulse-injury {
            0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4); }
            50% { box-shadow: 0 0 20px 5px rgba(220, 38, 38, 0.2); }
        }

        .injury-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .injury-icon {
            font-size: 20px;
        }

        .injury-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .severity-badge {
            background: rgba(0, 0, 0, 0.3);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            margin-left: auto;
        }

        .team-injuries {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 12px;
            border-radius: 8px;
            margin: 8px 0;
        }

        .team-injuries .team-name {
            font-weight: 700;
            font-size: 13px;
            display: block;
            margin-bottom: 4px;
        }

        .team-injuries .injury-summary {
            font-size: 12px;
            opacity: 0.9;
            display: block;
        }

        .team-injuries .spread-impact {
            font-size: 11px;
            font-weight: 600;
            margin-top: 4px;
            display: block;
            opacity: 0.8;
        }

        .injury-recommendation {
            margin-top: 10px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .injury-net-advantage {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            padding: 8px 12px;
            background: rgba(16, 185, 129, 0.2);
            border-radius: 6px;
            font-size: 12px;
            color: #6ee7b7;
        }

        .injury-net-advantage.negative {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>
                🎯 Best Bets Today
                <span class="ai-badge">AI POWERED</span>
            </h1>
            <div class="nav-buttons">
                <a href="/" class="nav-btn"><span>🏠 Dashboard</span></a>
                <a href="/live-betting" class="nav-btn"><span>📺 Live Games</span></a>
                <a href="/bets/new" class="nav-btn"><span>🎯 My Bets</span></a>
                <a href="/tax" class="nav-btn"><span>🧾 Tax Center</span></a>
            </div>
        </header>
        
        <div class="sport-selector">
            <div class="sport-buttons">
                <button class="sport-btn active" onclick="filterSport('ALL')" id="btn-all">
                    All Sports
                </button>
                <button class="sport-btn" onclick="filterSport('NFL')" id="btn-nfl">
                    🏈 NFL
                </button>
                <button class="sport-btn" onclick="filterSport('CFB')" id="btn-cfb">
                    🏈 College Football
                </button>
                <button class="sport-btn" onclick="filterSport('NBA')" id="btn-nba">
                    🏀 NBA
                </button>
                <button class="sport-btn" onclick="filterSport('CBB')" id="btn-cbb">
                    🏀 College Basketball
                </button>
                <button class="sport-btn" onclick="filterSport('NHL')" id="btn-nhl">
                    🏒 NHL
                </button>
                <button class="sport-btn" onclick="filterSport('MLB')" id="btn-mlb">
                    ⚾ MLB
                </button>
                <button class="sport-btn" onclick="filterSport('SOCCER')" id="btn-soccer">
                    ⚽ Soccer
                </button>
            </div>
        </div>
        
        <div id="stats-bar" class="stats-bar" style="display: none;">
            <div class="stat">
                <div class="stat-value" id="total-bets">0</div>
                <div class="stat-label">Total Best Bets</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="avg-confidence">0</div>
                <div class="stat-label">Avg Confidence</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="sports-count">0</div>
                <div class="stat-label">Sports Analyzed</div>
            </div>
        </div>
        
        <div id="loading" class="loading">
            <h2>🔥 Analyzing Games Across All Sports...</h2>
            <div class="spinner"></div>
            <p style="margin-top: 20px; color: #94a3b8;">
                Scanning NFL • CFB • NBA • CBB • MLB • NHL<br>
                Using AI to find the best value bets...
            </p>
        </div>
        
        <div id="bets-container" class="bets-grid" style="display: none;"></div>
    </div>
    
    <script>
        let allBets = [];
        let currentFilter = 'ALL';
        
        // Load best bets on page load
        loadBestBets();
        
        function loadBestBets() {
            fetch('/api/best-bets/all-sports')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        allBets = data.bets;
                        displayStats(data);
                        displayBets();
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('stats-bar').style.display = 'flex';
                        document.getElementById('bets-container').style.display = 'grid';
                    }
                })
                .catch(error => {
                    console.error('Error loading best bets:', error);
                    document.getElementById('loading').innerHTML = 
                        '<h2 style="color: #f44336;">Error Loading Best Bets</h2>' +
                        '<p>' + error.message + '</p>';
                });
        }
        
        function displayStats(data) {
            document.getElementById('total-bets').textContent = data.totalBets;
            
            // Calculate average confidence
            const avgConf = allBets.reduce((sum, bet) => sum + bet.confidence, 0) / allBets.length;
            document.getElementById('avg-confidence').textContent = avgConf.toFixed(1);
            
            // Count unique sports
            const sports = new Set(allBets.map(bet => bet.sport));
            document.getElementById('sports-count').textContent = sports.size;
        }
        
        function filterSport(sport) {
            currentFilter = sport;
            
            // Update button styles
            document.querySelectorAll('.sport-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById('btn-' + sport.toLowerCase()).classList.add('active');
            
            displayBets();
        }
        
        function displayBets() {
            const container = document.getElementById('bets-container');
            
            let filteredBets = allBets;
            if (currentFilter !== 'ALL') {
                filteredBets = allBets.filter(bet => bet.sport === currentFilter);
            }
            
            container.innerHTML = filteredBets.map((bet, index) => `
                <div class="bet-card">
                    <div class="bet-header">
                        <span class="sport-badge sport-${bet.sport.toLowerCase()}">${getSportIcon(bet.sport)} ${bet.sport}</span>
                        <span class="confidence-badge ${getConfidenceClass(bet.confidence)}">
                            ⭐ ${bet.confidence}/10
                        </span>
                    </div>
                    
                    <div class="matchup">
                        <div class="teams">${bet.awayTeam} @ ${bet.homeTeam}</div>
                        <div class="game-time">${formatGameTime(bet.gameTime)}</div>
                    </div>
                    
                    <div class="recommendation">
                        <div class="rec-label">AI RECOMMENDATION</div>
                        <div class="rec-value">${bet.recommendation}</div>
                        <div class="kelly-display">
                            💰 Kelly: <span class="kelly-percent">${formatKelly(bet.kellyPercent)}%</span> of bankroll
                        </div>
                    </div>
                    
                    <div class="best-odds">
                        ${formatBestOdds(bet.bestOdds)}
                    </div>

                    ${renderPublicBetting(bet)}

                    ${renderWeatherAlert(bet)}

                    ${renderInjuryAlert(bet)}

                    <div class="analysis">
                        <div class="analysis-label">AI ANALYSIS</div>
                        <div class="analysis-text">
                            ${getAnalysisPreview(bet.analysis)}
                        </div>
                        <button class="expand-btn" onclick="toggleAnalysis(${index})">
                            Read Full Analysis
                        </button>
                        <div class="analysis-full" id="analysis-${index}">
                            ${bet.analysis}
                        </div>
                    </div>

                    <div class="bet-actions">
                        <a href="/bets/new" class="action-btn primary-btn">
                            <span>📝 Place Bet</span>
                        </a>
                        <button class="action-btn quick-bet-btn" onclick="quickBet('${bet.awayTeam} @ ${bet.homeTeam}', '${bet.recommendation}', '${bet.kellyPercent}', '${getBestOddsValue(bet.bestOdds)}', '${getBestOddsBook(bet.bestOdds)}')">
                            <span>⚡ Quick Bet</span>
                        </button>
                    </div>
                </div>
            `).join('');
        }
        
        function getSportIcon(sport) {
            const icons = {
                'NFL': '🏈',
                'CFB': '🏈',
                'NBA': '🏀',
                'CBB': '🏀',
                'MLB': '⚾',
                'NHL': '🏒',
                'SOCCER': '⚽'
            };
            return icons[sport] || '🎯';
        }

        function renderWeatherAlert(bet) {
            // Only show weather alerts for outdoor sports
            if (!bet.weatherImpact || !bet.hasWeatherImpact) {
                return '';
            }

            const impact = bet.weatherImpact;
            const alertLevel = (impact.alertLevel || 'MEDIUM').toLowerCase();

            // Get weather icon based on conditions
            let weatherIcon = '☁️';
            if (impact.weatherData) {
                const conditions = (impact.weatherData.conditions || '').toLowerCase();
                if (conditions.includes('rain') || conditions.includes('drizzle')) {
                    weatherIcon = '🌧️';
                } else if (conditions.includes('snow')) {
                    weatherIcon = '❄️';
                } else if (conditions.includes('wind') || (impact.weatherData.windSpeed && impact.weatherData.windSpeed > 15)) {
                    weatherIcon = '💨';
                } else if (conditions.includes('clear') || conditions.includes('sun')) {
                    weatherIcon = '☀️';
                } else if (conditions.includes('cloud')) {
                    weatherIcon = '☁️';
                }
            }

            let impactHtml = '';
            if (impact.scoringImpact && impact.scoringImpact !== 0) {
                const scoringText = impact.scoringImpact > 0
                    ? `+${impact.scoringImpact.toFixed(1)} pts`
                    : `${impact.scoringImpact.toFixed(1)} pts`;
                impactHtml += `<span class="impact-scoring">Scoring: ${scoringText}</span>`;
            }
            if (impact.recommendation && impact.recommendation !== 'NO_IMPACT') {
                impactHtml += `<span class="impact-recommendation">Suggests: ${impact.recommendation}</span>`;
            }

            return `
                <div class="weather-alert alert-${alertLevel}">
                    <div class="weather-icon">${weatherIcon}</div>
                    <div class="weather-content">
                        <strong>WEATHER ALERT</strong>
                        <p>${impact.reason || 'Weather conditions may affect this game'}</p>
                        ${impactHtml ? `<div class="weather-impact">${impactHtml}</div>` : ''}
                    </div>
                </div>
            `;
        }

        function renderPublicBetting(bet) {
            // Only render if we have public betting data
            if (!bet.publicBettingData) {
                return '';
            }

            const publicData = bet.publicBettingData;
            const spreadContrarian = bet.spreadContrarian;
            const totalsContrarian = bet.totalsContrarian;

            // Get the percentages
            const homeSpread = publicData.spreadHomePercent || 50;
            const awaySpread = publicData.spreadAwayPercent || 50;
            const overPercent = publicData.overPercent || 50;
            const underPercent = publicData.underPercent || 50;

            // Determine if there's a contrarian alert
            let contrarianBadge = '';
            let contrarianRec = '';

            if (spreadContrarian && spreadContrarian.hasContrarianValue) {
                const alertLevel = (spreadContrarian.alertLevel || 'mild').toLowerCase();
                contrarianBadge = `<span class="contrarian-badge ${alertLevel}">🔥 ${alertLevel} FADE</span>`;

                const icon = alertLevel === 'extreme' ? '🔥' : alertLevel === 'strong' ? '📊' : '📈';
                contrarianRec = `
                    <div class="contrarian-recommendation">
                        <div class="contrarian-icon">${icon}</div>
                        <div class="contrarian-text">
                            <strong>FADE THE PUBLIC</strong>
                            <span>Bet ${spreadContrarian.contrarianSide} - ${spreadContrarian.publicPercent}% public on other side</span>
                        </div>
                        <div class="contrarian-edge">
                            <div class="edge-value">${spreadContrarian.historicalEdge?.toFixed(1) || '54.0'}%</div>
                            <div class="edge-label">Historical Edge</div>
                        </div>
                    </div>
                `;
            }

            // Check totals for additional contrarian value
            let totalsAlert = '';
            if (totalsContrarian && totalsContrarian.hasContrarianValue && totalsContrarian.publicPercent >= 70) {
                const icon = totalsContrarian.alertLevel === 'EXTREME' ? '🔥' : '📊';
                totalsAlert = `
                    <div class="contrarian-recommendation" style="margin-top: 8px; background: rgba(99, 102, 241, 0.2);">
                        <div class="contrarian-icon">${icon}</div>
                        <div class="contrarian-text">
                            <strong>TOTALS FADE</strong>
                            <span>Bet ${totalsContrarian.contrarianSide} - ${totalsContrarian.publicPercent}% on ${totalsContrarian.contrarianSide === 'UNDER' ? 'OVER' : 'UNDER'}</span>
                        </div>
                        <div class="contrarian-edge">
                            <div class="edge-value">${totalsContrarian.historicalEdge?.toFixed(1) || '54.0'}%</div>
                            <div class="edge-label">Historical Edge</div>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="public-betting-section">
                    <div class="public-betting-header">
                        <span class="public-betting-title">📊 Public Betting</span>
                        ${contrarianBadge}
                    </div>
                    <div class="betting-percentage-bars">
                        <div class="percentage-bar-row">
                            <span class="percentage-bar-label">Spread</span>
                            <div class="percentage-bar-container">
                                <div class="percentage-bar-home" style="width: ${homeSpread}%">
                                    ${homeSpread}%
                                </div>
                                <div class="percentage-bar-away" style="width: ${awaySpread}%">
                                    ${awaySpread}%
                                </div>
                            </div>
                        </div>
                        <div class="percentage-bar-row">
                            <span class="percentage-bar-label">O/U</span>
                            <div class="percentage-bar-container">
                                <div class="percentage-bar-home" style="width: ${overPercent}%; background: linear-gradient(90deg, #10b981, #34d399);">
                                    O ${overPercent}%
                                </div>
                                <div class="percentage-bar-away" style="width: ${underPercent}%; background: linear-gradient(90deg, #ef4444, #f87171);">
                                    U ${underPercent}%
                                </div>
                            </div>
                        </div>
                    </div>
                    ${contrarianRec}
                    ${totalsAlert}
                </div>
            `;
        }

        function renderInjuryAlert(bet) {
            // Only render if there's injury impact
            if (!bet.hasInjuryImpact) {
                return '';
            }

            const homeImpact = bet.homeInjuryImpact;
            const awayImpact = bet.awayInjuryImpact;
            const severity = bet.injurySeverity || 'NONE';
            const netAdvantage = bet.netInjuryAdvantage || 0;

            if (severity === 'NONE') {
                return '';
            }

            let homeSection = '';
            if (homeImpact && homeImpact.hasSignificantInjuries) {
                homeSection = `
                    <div class="team-injuries">
                        <span class="team-name">${bet.homeTeam}</span>
                        <span class="injury-summary">${homeImpact.summary || 'Injuries reported'}</span>
                        <span class="spread-impact">Impact: ${homeImpact.spreadImpact?.toFixed(1) || '0.0'} pts</span>
                    </div>
                `;
            }

            let awaySection = '';
            if (awayImpact && awayImpact.hasSignificantInjuries) {
                awaySection = `
                    <div class="team-injuries">
                        <span class="team-name">${bet.awayTeam}</span>
                        <span class="injury-summary">${awayImpact.summary || 'Injuries reported'}</span>
                        <span class="spread-impact">Impact: ${awayImpact.spreadImpact?.toFixed(1) || '0.0'} pts</span>
                    </div>
                `;
            }

            let netAdvantageSection = '';
            if (Math.abs(netAdvantage) >= 2.0) {
                const advantageTeam = netAdvantage > 0 ? bet.homeTeam : bet.awayTeam;
                const isNegative = netAdvantage < 0;
                netAdvantageSection = `
                    <div class="injury-net-advantage ${isNegative ? 'negative' : ''}">
                        <span>📊</span>
                        <span><strong>${advantageTeam}</strong> is ${Math.abs(netAdvantage).toFixed(1)} pts healthier</span>
                    </div>
                `;
            }

            let recommendation = '';
            if (bet.injuryRecommendation) {
                recommendation = `
                    <div class="injury-recommendation">
                        ${bet.injuryRecommendation}
                    </div>
                `;
            }

            return `
                <div class="injury-section">
                    <div class="injury-alert ${severity}">
                        <div class="injury-header">
                            <span class="injury-icon">🏥</span>
                            <span class="injury-title">INJURY REPORT</span>
                            <span class="severity-badge">${severity}</span>
                        </div>
                        ${homeSection}
                        ${awaySection}
                        ${netAdvantageSection}
                        ${recommendation}
                    </div>
                </div>
            `;
        }

        function getConfidenceClass(confidence) {
            if (confidence >= 8) return 'confidence-high';
            if (confidence >= 6) return 'confidence-medium';
            return 'confidence-low';
        }
        
        function formatGameTime(isoString) {
            const date = new Date(isoString);
            return date.toLocaleString('en-US', {
                month: 'short',
                day: 'numeric',
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            });
        }
        
        function formatBestOdds(odds) {
            if (!odds) return '<p>No odds available</p>';

            let html = '';

            // Soccer 3-way betting format (has 'outcome' field)
            if (odds.outcome) {
                const outcomeLabel = {
                    'HOME_WIN': 'Home Win',
                    'DRAW': 'Draw',
                    'AWAY_WIN': 'Away Win'
                }[odds.outcome] || odds.outcome;

                const bookDisplay = odds.book || 'No MO books';
                html += `
                    <div class="odds-item soccer-odds">
                        <div class="odds-label">${outcomeLabel}</div>
                        <div class="odds-value">${formatOdds(odds.odds)}</div>
                        <div class="odds-book">${bookDisplay}</div>
                    </div>
                `;
                return html;
            }

            // US Sports format
            if (odds.homeML) {
                html += `
                    <div class="odds-item">
                        <div class="odds-label">Best Home ML</div>
                        <div class="odds-value">${formatOdds(odds.homeML)}</div>
                        <div class="odds-book">${odds.homeMLBook}</div>
                    </div>
                `;
            }

            if (odds.awayML) {
                html += `
                    <div class="odds-item">
                        <div class="odds-label">Best Away ML</div>
                        <div class="odds-value">${formatOdds(odds.awayML)}</div>
                        <div class="odds-book">${odds.awayMLBook}</div>
                    </div>
                `;
            }

            if (odds.homeSpreadOdds) {
                html += `
                    <div class="odds-item">
                        <div class="odds-label">Best Home Spread</div>
                        <div class="odds-value">${formatOdds(odds.homeSpreadOdds)}</div>
                        <div class="odds-book">${odds.homeSpreadBook}</div>
                    </div>
                `;
            }

            if (odds.awaySpreadOdds) {
                html += `
                    <div class="odds-item">
                        <div class="odds-label">Best Away Spread</div>
                        <div class="odds-value">${formatOdds(odds.awaySpreadOdds)}</div>
                        <div class="odds-book">${odds.awaySpreadBook}</div>
                    </div>
                `;
            }

            return html || '<p>Odds available</p>';
        }
        
        function formatOdds(odds) {
            if (odds > 0) return '+' + odds;
            return odds.toString();
        }
        
        function getAnalysisPreview(analysis) {
            if (!analysis) return 'No analysis available';
            
            // Extract just the reason part if formatted
            if (analysis.includes('REASON:')) {
                const reason = analysis.split('REASON:')[1];
                return reason ? reason.substring(0, 150) + '...' : analysis.substring(0, 150) + '...';
            }
            
            return analysis.substring(0, 150) + '...';
        }
        
        function toggleAnalysis(index) {
            const element = document.getElementById('analysis-' + index);
            element.classList.toggle('expanded');

            const btn = event.target;
            if (element.classList.contains('expanded')) {
                btn.textContent = 'Hide Analysis';
            } else {
                btn.textContent = 'Read Full Analysis';
            }
        }

        function formatKelly(kellyPercent) {
            if (kellyPercent == null || kellyPercent === 0) {
                return '0.0';
            }
            // Service already returns percentage (0-100), so don't multiply by 100
            return kellyPercent.toFixed(1);
        }

        function getBestOddsValue(odds) {
            if (!odds) return '';
            // Soccer format (3-way)
            if (odds.odds) return odds.odds;
            // US Sports format
            return odds.homeML || odds.awayML || odds.homeSpreadOdds || odds.awaySpreadOdds || '';
        }

        function getBestOddsBook(odds) {
            if (!odds) return '';
            // Soccer format (3-way)
            if (odds.book) return odds.book;
            // US Sports format
            return odds.homeMLBook || odds.awayMLBook || odds.homeSpreadBook || odds.awaySpreadBook || '';
        }

        function quickBet(game, pick, kellyPercent, odds, sportsbook) {
            // Calculate recommended stake based on Kelly criterion
            // Assuming $1000 bankroll for demonstration (you can adjust this)
            const bankroll = 1000;
            const recommendedStake = (bankroll * kellyPercent / 100).toFixed(2);

            // Store bet data in localStorage for the bet form to read
            const betData = {
                game: game,
                pick: pick,
                stake: recommendedStake,
                odds: odds,
                sportsbook: sportsbook,
                timestamp: Date.now()
            };

            localStorage.setItem('quickBetData', JSON.stringify(betData));

            // Redirect to bet form
            window.location.href = '/bets/new';
        }
    </script>
</body>
</html>

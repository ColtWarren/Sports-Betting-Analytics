# ===========================================
# RAILWAY PRODUCTION CONFIGURATION
# ===========================================

# Server
server.port=${PORT:8080}

# Database (Railway PostgreSQL)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:bettingdb}
spring.datasource.username=${PGUSER:sa}
spring.datasource.password=${PGPASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.postgresql.Driver}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.show-sql=false

# H2 Console (disabled in production)
spring.h2.console.enabled=false

# ===========================================
# API KEYS (from Railway environment variables)
# ===========================================
odds.api.key=${ODDS_API_KEY:}
openweathermap.api.key=${OPENWEATHERMAP_API_KEY:}
claude.api.key=${CLAUDE_API_KEY:}
cfb.api.key=${CFB_API_KEY:}
cbb.api.key=${CBB_API_KEY:}

# ===========================================
# PRODUCTION SETTINGS
# ===========================================
app.version=2.9.0

# Logging
logging.level.root=INFO
logging.level.com.coltwarren=INFO
logging.level.org.springframework=WARN

# Security
server.error.include-stacktrace=never
server.error.include-message=never

# Swagger (enable in production for API docs)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

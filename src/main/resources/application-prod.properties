# ===========================================
# RAILWAY PRODUCTION CONFIGURATION
# ===========================================

# Server
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# ===========================================
# DATABASE - MySQL (Railway MySQL plugin)
# ===========================================
# Railway provides: MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT:3306}/${MYSQLDATABASE}?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# WebClient buffer (16MB for large API responses like NCAAB)
spring.codec.max-in-memory-size=16MB

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# H2 Console - DISABLED in production
spring.h2.console.enabled=false

# ===========================================
# API KEYS (no fallback defaults — fail fast if missing)
# ===========================================
odds-api.api-key=${ODDS_API_KEY}
odds-api.base-url=https://api.the-odds-api.com/v4
openweathermap.api.key=${OPENWEATHERMAP_API_KEY:}
claude.api.key=${CLAUDE_API_KEY}
cfb.api.key=${CFB_API_KEY:}
cbb.api.key=${CBB_API_KEY:}
balldontlie.api.key=${BALLDONTLIE_API_KEY:}
balldontlie.api.base-url=https://api.balldontlie.io/wnba/v1

# ===========================================
# CORS CONFIGURATION
# ===========================================
cors.allowed-origins=${APP_BASE_URL:https://web-production-698cf.up.railway.app}

# ===========================================
# APP SETTINGS
# ===========================================
app.version=2.9.0

# Logging - keep minimal in production
logging.level.root=WARN
logging.level.com.coltwarren=INFO
logging.level.com.coltwarren.sports_betting_analytics=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# ===========================================
# GOOGLE OAUTH2 CONFIGURATION
# ===========================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${APP_BASE_URL:https://web-production-698cf.up.railway.app}/login/oauth2/code/google

# Swagger - DISABLED in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

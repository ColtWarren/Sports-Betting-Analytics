# ===========================================
# RAILWAY PRODUCTION CONFIGURATION
# ===========================================

# Server
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# ===========================================
# DATABASE - Use H2 in-memory (no external DB needed!)
# ===========================================
spring.datasource.url=jdbc:h2:mem:bettingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# WebClient buffer (16MB for large API responses like NCAAB)
spring.codec.max-in-memory-size=16MB

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (optional, for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===========================================
# API KEYS
# ===========================================
odds.api.key=${ODDS_API_KEY:demo}
openweathermap.api.key=${OPENWEATHERMAP_API_KEY:demo}
claude.api.key=${CLAUDE_API_KEY:demo}
cfb.api.key=${CFB_API_KEY:}
cbb.api.key=${CFB_API_KEY:}
balldontlie.api.key=${BALLDONTLIE_API_KEY:}
balldontlie.api.base-url=https://api.balldontlie.io/wnba/v1

# ===========================================
# APP SETTINGS
# ===========================================
app.version=2.9.0

# Logging - keep minimal in production to avoid log flooding
logging.level.root=WARN
logging.level.com.coltwarren=INFO
logging.level.com.coltwarren.sports_betting_analytics=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# ===========================================
# GOOGLE OAUTH2 CONFIGURATION
# ===========================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:none}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:none}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${APP_BASE_URL:https://web-production-698cf.up.railway.app}/login/oauth2/code/google

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

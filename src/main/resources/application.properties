# Spring Profile Configuration
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# API-Football Configuration (FREE TIER - 100 requests/day)
apifootball.api.key=${APIFOOTBALL_API_KEY:}
spring.application.name=BettingAnalytics
# ============================================
# DATABASE CONFIGURATION
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/betting_analytics?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# HIKARICP CONNECTION POOL
# ============================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================
# JPA / HIBERNATE CONFIGURATION
# ============================================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=8080

# ============================================
# CORS CONFIGURATION
# ============================================
cors.allowed-origins=http://localhost:8080

# ============================================
# WEBCLIENT CONFIGURATION
# ============================================
spring.codec.max-in-memory-size=16MB

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.com.coltwarren.sports_betting_analytics=INFO



# ============================================
# CLAUDE AI CONFIGURATION
# ============================================
claude.api.key=${CLAUDE_API_KEY}
claude.api.url=https://api.anthropic.com/v1/messages
claude.model=claude-sonnet-4-20250514

# ============================================
# ODDS API CONFIGURATION
# ============================================
odds.api.key=${ODDS_API_KEY}
odds.api.url=https://api.the-odds-api.com/v4

# Odds API scheduling & rate limiting
odds-api.enabled=true
odds-api.api-key=${ODDS_API_KEY}
odds-api.base-url=https://api.the-odds-api.com/v4
odds-api.refresh-interval-minutes=15
odds-api.startup-fetch=true
odds-api.delay-between-leagues-ms=300
odds-api.max-retries=3
odds-api.retry-delay-ms=1000
odds-api.cache-ttl-minutes=20
odds-api.serve-stale-if-error=true
odds-api.stale-max-age-minutes=60
odds-api.enabled-leagues=americanfootball_nfl,basketball_nba,basketball_ncaab,icehockey_nhl,baseball_mlb,americanfootball_ncaaf,soccer_epl,soccer_usa_mls,soccer_uefa_champs_league,soccer_spain_la_liga,soccer_italy_serie_a,soccer_france_ligue_one,soccer_germany_bundesliga
weather.api.key=${WEATHER_API_KEY:}
openweathermap.api.key=${OPENWEATHERMAP_API_KEY:}

# ============================================
# COLLEGE FOOTBALL DATA API (CollegeFootballData.com)
# ============================================
cfb.api.key=${CFB_API_KEY:}
cfb.api.url=https://api.collegefootballdata.com

# ============================================
# COLLEGE BASKETBALL DATA API (CollegeBasketballData.com)
# ============================================
cbb.api.key=${CBB_API_KEY:}
cbb.api.url=https://api.collegebasketballdata.com

# ============================================
# BALLDONTLIE API (WNBA Stats)
# ============================================
# Free tier: 5 requests/minute
# Get API key from: https://www.balldontlie.io/
balldontlie.api.key=${BALLDONTLIE_API_KEY:}
balldontlie.api.base-url=https://api.balldontlie.io/wnba/v1

# ============================================
# SPORTSDATA.IO CONFIGURATION (Test/Evaluation only)
# ============================================
sportsdata.api.key=${SPORTSDATA_API_KEY:}

# ============================================
# GOOGLE OAUTH2 CONFIGURATION
# ============================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ============================================
# SESSION CONFIGURATION
# ============================================
server.servlet.session.timeout=30m

# ============================================
# SPRINGDOC / OPENAPI CONFIGURATION
# ============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ============================================
# API-FOOTBALL CONFIGURATION (Soccer)
# ============================================
# FREE TIER: 100 requests/day
# Get API key from: https://www.api-football.com/

